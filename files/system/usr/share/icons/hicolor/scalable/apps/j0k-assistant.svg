<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 256 256" width="256" height="256">
  <defs>
    <radialGradient id="glow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#00e5ff" stop-opacity="0.6"/>
      <stop offset="60%" stop-color="#f59e0b" stop-opacity="0.3"/>
      <stop offset="100%" stop-color="#000000" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="plateGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#0f172a"/>
      <stop offset="50%" stop-color="#070b14"/>
      <stop offset="100%" stop-color="#030712"/>
    </linearGradient>
    <linearGradient id="starGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#ffeb78"/>
      <stop offset="40%" stop-color="#f59e0b"/>
      <stop offset="80%" stop-color="#d97706"/>
      <stop offset="100%" stop-color="#b45309"/>
    </linearGradient>
    <radialGradient id="coreGrad" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#0f172a"/>
      <stop offset="80%" stop-color="#070b14"/>
      <stop offset="100%" stop-color="#00e5ff"/>
    </radialGradient>
    <filter id="neonShadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="2" stdDeviation="3" flood-color="#00e5ff" flood-opacity="0.8"/>
    </filter>
  </defs>

  <!-- Outer Glow -->
  <circle cx="128" cy="128" r="120" fill="url(#glow)"/>

  <!-- Base Plate -->
  <circle cx="128" cy="128" r="108" fill="url(#plateGrad)" stroke="#00e5ff" stroke-width="4"/>

  <!-- Inner Gold Ring -->
  <circle cx="128" cy="128" r="98" fill="none" stroke="#f59e0b" stroke-width="2" stroke-opacity="0.8"/>

  <!-- 5-Pointed Star -->
  <polygon points="128,43 150,95 208,98 163,136 178,192 128,159 78,192 93,136 48,98 106,95"
           fill="url(#starGrad)" stroke="#ffffff" stroke-width="2"/>

  <!-- Center Core -->
  <circle cx="128" cy="130" r="48" fill="url(#coreGrad)" stroke="#00e5ff" stroke-width="2.5"/>

  <!-- Stylized J -->
  <text x="128" y="152" font-family="Segoe UI, Ubuntu, sans-serif" font-size="64" font-weight="900"
        fill="#ffffff" text-anchor="middle" filter="url(#neonShadow)">J</text>
</svg>
---
# yaml-language-server: $schema=https://schema.blue-build.org/recipe-v1.json
# image will be published to ghcr.io/<user>/<name>
name: jok-ai-os
# description will be included in the image's metadata
description: JOK-AI-OS - Universal Autonomous AI Operating System

# the base image to build on top of (FROM) and the version tag to use
base-image: ghcr.io/ublue-os/kinoite-main
image-version: 44 # Version 44 core

# module configuration, executed in orde
# you can include multiple instances of the same module
modules:
  - type: files
    files:
      - source: system
        destination: / # copies files/system/* into image root folder /

  # Module 1: Add RPM Fusion Free and Nonfree repositories
  - type: rpm-ostree
    install:
      - https://mirrors.rpmfusion.org/free/fedora/rpmfusion-free-release-44.noarch.rpm
      - https://mirrors.rpmfusion.org/nonfree/fedora/rpmfusion-nonfree-release-44.noarch.rpm

  # Module 2: Core container tools, Git, Curl, RamaLama AI runtime, and Universal App Compatibility
  - type: rpm-ostree
    install:
      - podman
      - distrobox
      - git
      - curl
      - ramalama
      - espeak-ng
      - alsa-utils
      - python3-tkinter
      - fuse
      - fuse-libs
      - android-tools
      - python3-pillow
      - python3-pyxdg

  # Module 3: Rebranding - remove upstream logos (replaces with JOK-AI-OS branding)
  - type: rpm-ostree
    remove:
      - fedora-logos

  # Module 4: Rebranding - copy branding assets to /usr/share/jok-ai-os/
  - type: files
    files:
      - source: branding
        destination: /usr/share/jok-ai-os

  # Module 5: AI Daemon Integration - Enable RamaLama user unit
  - type: script
    scripts:
      - setup-ai-daemon.sh

  - type: default-flatpaks
    configurations:
      - notify: true # Send notification after install/uninstall is finished (true/false)
        scope: system
        # If no repo information is specified, Flathub will be used by default
        install: # system flatpaks we want all users to have and not remove
          - org.mozilla.firefox
      - scope: user # Also add Flathub user repo, but no user packages

  - type: signing # sets up proper policy & signing files for signed images to work fully
